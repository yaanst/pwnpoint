name: Release

# Publishes a GitHub Release with the single-file app, its SHA-256 checksum and a
# signed build provenance attestation. Two ways to start it:
# - push a tag vX.Y.Z (it must match package.json), or
# - run it manually on main ("Run workflow"): it reads the version from package.json,
#   and creates the tag vX.Y.Z on the commit it built, together with the release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Work out the tag and check it matches package.json
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$EVENT" = "push" ]; then
            test "$REF_NAME" = "$expected" || { echo "::error::Tag $REF_NAME but package.json says $expected"; exit 1; }
          else
            test "$REF" = "refs/heads/main" || { echo "::error::Run the release from main"; exit 1; }
            if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$expected" --silent 2>/dev/null; then
              echo "::error::Tag $expected already exists. Bump the version in package.json first."; exit 1
            fi
          fi
          echo "name=$expected" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:urls
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Name the file and compute its checksum
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          mkdir release
          cp dist/index.html "release/pwnpoint-$TAG.html"
          (cd release && sha256sum "pwnpoint-$TAG.html" > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/pwnpoint-*.html
      - name: Create the GitHub Release (and the tag, for a manual run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then where=(--verify-tag); else where=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --title "PwnPoint $TAG" --generate-notes "${where[@]}"
