name: Release

# Pushing a tag vX.Y.Z publishes a GitHub Release with the single-file app,
# its SHA-256 checksum and a signed build provenance attestation.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:urls
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - name: Name the file and compute its checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp dist/index.html "release/pwnpoint-$TAG.html"
          (cd release && sha256sum "pwnpoint-$TAG.html" > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/pwnpoint-*.html
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY"
          --title "PwnPoint $TAG" --generate-notes --verify-tag
